<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼控制台</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --panel2:#f8f9fc; --ink:#1b2130; --muted:#69718a; --line:#e3e6ee;
  --accent:#4d6bfe; --accent-ink:#fff; --soft:#eef1ff; --good:#119c55; --good-soft:#e7f7ef;
  --warn:#c77700; --warn-soft:#fff4e0; --bad:#e0454b; --bad-soft:#fdecec; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --c1:#4d6bfe; --c2:#18a59a; --c3:#e8913a; --c4:#b05bdc; --c5:#e0454b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1117; --panel:#161a22; --panel2:#1b202a; --ink:#e6e9f0; --muted:#98a1b3; --line:#272d39;
  --accent:#7d93ff; --accent-ink:#0e1117; --soft:#1d2440; --good:#3fc77f; --good-soft:#12291d;
  --warn:#f0a840; --warn-soft:#2c2213; --bad:#ff6b70; --bad-soft:#2d1618; --shadow:none;
  --c1:#7d93ff; --c2:#36c2b4; --c3:#f0a54f; --c4:#c582ea; --c5:#ff6b70;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
nav{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 12px;font-weight:700;font-size:16px;letter-spacing:.5px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
nav button{all:unset;cursor:pointer;display:block;padding:9px 18px;margin:1px 8px;border-radius:8px;color:var(--ink)}
nav button:hover{background:var(--panel2)}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
.navfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1180px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.card.alert{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--panel))}
.qq{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qq .qr{width:232px;height:232px;flex:none;image-rendering:pixelated;background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.qq ol li{margin:3px 0}
.navfoot a.badge{text-decoration:none}
.cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media (max-width:900px){.cols{grid-template-columns:1fr}nav{width:150px}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:650;line-height:1.25}
.stat span{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.small{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.badge.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--soft);color:var(--accent);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:12px}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical}
input[type=number]{width:92px}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(16px)}
.set{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .lab{flex:1;min-width:0}
.set .lab b{font-weight:600}
.set .lab div{color:var(--muted);font-size:12px}
.set.changed .lab b:after{content:" ·改了";color:var(--warn);font-weight:400;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px;border-top:0}
.list{max-height:70vh;overflow:auto}
.item{padding:9px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--panel2)}
.item.on{background:var(--soft)}
.fact{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .t{flex:1}
.chat{font-size:13px;max-height:420px;overflow:auto;background:var(--panel2);border-radius:8px;padding:8px 10px}
.chat div{padding:2px 0}
.chat .me{color:var(--accent)}
.logbox{font:12px/1.6 Consolas,"Cascadia Mono",monospace;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:66vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
.logbox .tag{color:var(--accent);font-weight:600}
.logbox .err{color:var(--bad)}
.logbox .t{color:var(--muted)}
.chip{all:unset;cursor:pointer;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;background:var(--panel)}
.chip.on{background:var(--soft);color:var(--accent);border-color:transparent}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.stk .s{border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel);cursor:pointer;text-align:center;position:relative}
.stk .s.off{opacity:.38}
.stk .s.pick{outline:2px solid var(--accent)}
.stk img{width:100%;height:88px;object-fit:contain;display:block;border-radius:6px;background:var(--panel2)}
.stk .n{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .e{font-size:11px;color:var(--muted)}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;max-width:420px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast div.bad{background:var(--bad);color:#fff}
.savebar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.secret{display:flex;gap:6px;align-items:center}
.fpcard.on{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn-soft) 40%,var(--panel))}
.fpbar{position:relative;margin:16px 2px 30px}
.fpbar input[type=range]{width:100%;margin:0;accent-color:var(--accent);cursor:pointer;height:22px}
.fpbar input[type=range]:disabled{cursor:not-allowed;opacity:.5}
.fpticks{position:absolute;left:8px;right:8px;top:26px;height:16px;font-size:11px;color:var(--muted);pointer-events:none}
.fpticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.fpticks span:first-child{transform:none}
.fpticks span:last-child{transform:translateX(-100%)}
.fpticks span::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:var(--line)}
.fpticks span:first-child::before{left:0}
.fpticks span:last-child::before{left:100%}
@media (max-width:700px){.fpticks span.minor{display:none}}
.fpst{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.fpcard.on .fpst{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fpst .big{font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;opacity:.45}
.dot.on{background:var(--warn);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}
.fpwarn{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.upbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.upbar.info{background:var(--soft);border-color:transparent}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">大肥鱼控制台<small>只有这台电脑能打开</small></div>
    <div id="nav"></div>
    <div class="navfoot" id="navfoot">连接中…</div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
"use strict";
const PAGES = [
  ["overview", "总览"], ["settings", "功能开关"], ["people", "群和人"], ["send", "代发消息"],
  ["memory", "记忆和好感"], ["stickers", "表情包"], ["sing", "唱歌"], ["stats", "统计"], ["usage", "用量和余额"], ["logs", "日志"],
  ["persona", "人设"], ["tools", "工具"],
];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Panel": "1"}, body: JSON.stringify(body)};
  try { const r = await fetch(path, opt); return await r.json(); }
  catch (e) { return {ok: false, error: "控制台没响应（黑窗口关了？）"}; }
}
async function wipeFlow(uid, name) {
  const pv = await api(`/api/wipe/preview?uid=${encodeURIComponent(uid)}`);
  if (!pv.ok) { toast(pv.error || "读不到", true); return false; }
  if (!confirm(`真的删掉「${name || uid}」的所有数据？\n\n会删：${pv.text}\n群里别人提到他的地方会换成「某人」；共享印象会清掉重新提炼。\n\n真删 不留备份 找不回来。`)) return false;
  const r = await api("/api/wipe", {uid});
  toast(r.ok ? "删好了：" + (r.text || "") + (r.offline ? "（机器人没开 直接删的文件）" : "") : (r.error || "没删成"), !r.ok);
  return r.ok;
}
function toast(msg, bad = false) {
  const d = document.createElement("div"); d.textContent = msg; if (bad) d.className = "bad";
  $("#toast").appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3500);
}
function ago(ts) {
  if (!ts) return "—";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "刚刚"; if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前"; if (d < 172800) return "昨天";
  const t = new Date(ts * 1000); return `${t.getMonth() + 1}-${t.getDate()}`;
}
function hm(ts) { const t = new Date(ts * 1000); return `${t.getMonth() + 1}-${t.getDate()} ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`; }
function dur(sec) { sec = Math.max(0, Math.floor(sec)); if (sec < 3600) return Math.floor(sec / 60) + " 分钟"; if (sec < 86400) return (sec / 3600).toFixed(1) + " 小时"; return (sec / 86400).toFixed(1) + " 天"; }
const money = v => "$" + (v || 0).toFixed(v >= 1 ? 2 : 3);
const num = v => (v || 0).toLocaleString();
let timers = [], RENDER = 0;   // RENDER：第几次换页（换页后 上一页还没跑完的那些不再动页面）
function every(ms, fn) {
  const my = RENDER;
  const id = setInterval(() => { if (my !== RENDER) { clearInterval(id); return; } fn(); }, ms);
  timers.push(id);
}
function clearTimers() { timers.forEach(clearInterval); timers = []; }

/* ───────── 导航 ───────── */
function nav() {
  const cur = location.hash.slice(1) || "overview";
  $("#nav").innerHTML = PAGES.map(([k, n]) => `<button class="${k === cur ? "on" : ""}" data-p="${k}">${n}</button>`).join("");
  $("#nav").onclick = e => { const p = e.target.dataset.p; if (p) { location.hash = p; } };
}
window.addEventListener("hashchange", render);
async function render() {
  const my = ++RENDER;
  clearTimers(); nav();
  const cur = location.hash.slice(1) || "overview";
  const fn = VIEWS[cur] || VIEWS.overview;
  $("#main").onclick = null;
  $("#main").innerHTML = '<div class="empty">加载中…</div>';
  try { await fn($("#main")); if (my === RENDER) upBanner(); } catch (e) {
    if (my !== RENDER) return;          // 页面还没加载完就点了别的页：上一页剩下的不管了（以前会报「Cannot set properties of null」）
    console.error(e);
    $("#main").innerHTML = `<div class="card">出错了：${esc(e)}<div class="small muted" style="margin-top:6px">刷新一下页面再试；还这样就把这句话发给 Claude</div></div>`;
  }
}
let BOT = {bot: "offline"};
async function pollFoot() {
  const o = await api("/api/overview");
  if (!o || o.ok === false && !o.bot) { $("#navfoot").innerHTML = '<span class="badge bad">控制台没响应</span>'; return; }
  BOT = o;
  const m = {online: ["good", "机器人运行中"], offline: ["", "机器人没在运行"], stuck: ["warn", "进程在 但没响应"], error: ["bad", "接口出错"]}[o.bot] || ["", o.bot];
  const q = QQS[(o.qq || {}).state] || ["", "QQ 状态不明"];
  const fs = fpState(o).full, fon = fs && fs.on && (fs.until < 0 || fs.until > Date.now() / 1000);
  $("#navfoot").innerHTML = `<span class="badge ${m[0]}">${m[1]}</span><div style="margin-top:6px"><a href="#overview" class="badge ${q[0]}">${q[1]}</a></div>` +
    (fon ? `<div style="margin-top:6px"><a href="#overview" class="badge warn" title="点这里去总览页关掉">火力全开中 · ${fs.until < 0 ? "一直开" : "还剩 " + fpShort(fs.until - Date.now() / 1000)}</a></div>` : "");
  checkVersion();
  document.title = (o.qq || {}).state === "scan" ? "⚠ QQ 要扫码 · 大肥鱼控制台" : "大肥鱼控制台";
  return o;
}
const QQS = {ok: ["good", "QQ 在线"], scan: ["bad", "QQ 掉线了 要扫码"], off: ["bad", "QQ 没开"], starting: ["warn", "QQ 启动 / 登录中"]};
const EMO = {happy: "开心", calm: "安心", sweet: "甜", hurt: "委屈", worry: "担心", sad: "低落", jealous: "吃醋"};
const EMO_GOOD = new Set(["happy", "calm", "sweet"]);

/* ───────── 小图表 ───────── */
function niceStep(raw) {           // 刻度取 1 / 2 / 2.5 / 5 × 10ⁿ
  if (!(raw > 0)) return 0;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
const stepDec = s => { for (let d = 0; d < 7; d++) { const x = s * 10 ** d; if (Math.abs(Math.round(x) - x) < 1e-6 * Math.max(1, x)) return d; } return 6; };
function short(v, d) {
  if (Math.abs(v) >= 1000) { const k = v / 1000; return (Number.isInteger(k) ? k : +k.toFixed(2)) + "k"; }
  return v.toFixed(d);
}
function bars(el, labels, series, {stacked = false, h = 190, money = false} = {}) {
  const W = 760, H = h, L = 52, B = 24, T = 8;
  const totals = labels.map((_, i) => stacked ? series.reduce((a, s) => a + (s.values[i] || 0), 0) : Math.max(...series.map(s => s.values[i] || 0)));
  const minStep = money ? 0.001 : 1;
  const step = Math.max(minStep, niceStep(Math.max(0, ...totals) / 4));
  const max = step * 4, dec = stepDec(step);
  const fmt = v => (money ? "$" : "") + short(v, dec);
  const tip = v => money ? "$" + (v || 0).toFixed(v >= 1 ? 2 : 4) : num(v);
  const bw = (W - L - 8) / labels.length;
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const y = T + (H - T - B) * (1 - k / 4);
    g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${esc(fmt(step * k))}</text>`;
  }
  labels.forEach((lab, i) => {
    let y0 = H - B;
    const inner = stacked ? bw * .62 : bw * .8 / series.length;
    series.forEach((s, j) => {
      const v = s.values[i] || 0, hh = (H - T - B) * v / max;
      const x = L + 4 + i * bw + (stacked ? bw * .19 : bw * .1 + j * inner);
      const y = stacked ? y0 - hh : H - B - hh;
      g += `<rect x="${x}" y="${y}" width="${Math.max(1, inner - 1)}" height="${Math.max(0, hh)}" rx="2" fill="${s.color}"><title>${esc(lab)} ${esc(s.name)}：${esc(tip(v))}</title></rect>`;
      if (stacked) y0 -= hh;
    });
    if (labels.length <= 16 || i % Math.ceil(labels.length / 14) === 0) g += `<text x="${L + 4 + i * bw + bw / 2}" y="${H - 7}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function curvechart(el, b, {h = 200} = {}) {
  /* 省 token 曲线：横轴 = 最近花的钱 纵轴 = 回不回的概率；竖线 = 现在 */
  if (!b) { el.innerHTML = ""; return; }
  const W = 760, H = h, L = 46, B = 24, T = 8;
  const w = u => b.floor + (1 - b.floor) / (1 + Math.pow(Math.max(0, u) / b.half_usd, b.shape));
  const umax = Math.max(b.half_usd * 6, b.spent * 1.3, 0.05);
  const X = u => L + (W - L - 8) * u / umax, Y = p => T + (H - T - B) * (1 - p);
  const lines = [["私聊", "private", "var(--c2)"], ["被 @/叫名字", "direct", "var(--c1)"], ["没 @ 的接话", "follow", "var(--c3)"],
    ["自己插话", "chat", "var(--c4)"], ["冒泡/主动找人", "extra", "var(--c5)"]];
  let g = "";
  [0, .25, .5, .75, 1].forEach(p => { g += `<line x1="${L}" x2="${W}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(p) + 4}" text-anchor="end">${Math.round(p * 100)}%</text>`; });
  const step = niceStep(umax / 5), dec = stepDec(step);
  for (let u = 0; u <= umax + 1e-9; u += step) g += `<text x="${X(u)}" y="${H - 7}" text-anchor="middle">$${short(u, dec)}</text>`;
  lines.forEach(([, k, c]) => {

const getp = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
VIEWS.settings = async main => {
  const r = await api("/api/config"); const C = r.config || {};
  const changed = {};
  main.innerHTML = `<h1>功能开关</h1><p class="sub">改完点下面的「保存」。大部分设置要重启机器人才生效（重启只要十几秒 QQ 不会掉线）</p><div id="sets"></div>
    <div class="savebar"><span id="chg" class="muted">没有改动</span><span class="spacer"></span><button class="btn" id="save">保存</button><button class="btn primary" id="saverestart">保存并重启机器人</button></div>`;
  $("#sets").innerHTML = SETTINGS.map(([sec, rows]) => `<div class="card"><h2>${sec}</h2>${rows.map(([p, lab, desc, type, a, b, c]) => {
    const v = getp(C, p); let ctl = "";
    if (type === "bool") ctl = `<label class="sw"><input type="checkbox" data-p="${p}" ${v ? "checked" : ""}><span></span></label>`;
    else if (type === "num") ctl = `<input type="number" data-p="${p}" value="${v ?? ""}" min="${a}" max="${b}" step="${c}">`;
    else if (type === "text") ctl = `<input type="text" data-p="${p}" value="${esc(v ?? "")}" style="width:260px">`;
    else if (type === "select") ctl = `<select data-p="${p}">${a.map(([k, n]) => `<option value="${esc(k)}" ${String(v ?? "") === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    else if (type === "pair") ctl = `<span class="row"><input type="number" data-p="${p}" data-i="0" value="${(v || [])[0] ?? ""}" min="${a}" max="${b}" step="${c}"> 点到 <input type="number" data-p="${p}" data-i="1" value="${(v || [])[1] ?? ""}" min="${a}" max="${b}" step="${c}"> 点</span>`;
    else if (type === "secret") ctl = `<span class="secret">${v && v.set ? '<span class="badge good">已填</span>' : '<span class="badge warn">没填</span>'}<input type="password" data-p="${p}" placeholder="要换就填新的" style="width:220px"></span>`;
    return `<div class="set" data-row="${p}"><div class="lab"><b>${esc(lab)}</b>${desc ? `<div>${esc(desc)}</div>` : ""}</div>${v === undefined && type !== "secret" ? '<span class="badge">配置里没有</span>' : ctl}</div>`;
  }).join("")}</div>`).join("");
  const mark = () => { const n = Object.keys(changed).length; $("#chg").textContent = n ? `改了 ${n} 项还没保存` : "没有改动"; document.querySelectorAll(".set").forEach(el => el.classList.toggle("changed", el.dataset.row in changed)); };
  $("#sets").addEventListener("input", e => {
    const el = e.target, p = el.dataset.p; if (!p) return;
    let v;
    if (el.type === "checkbox") v = el.checked;
    else if (el.type === "number") {
      if (el.dataset.i !== undefined) { const both = [...document.querySelectorAll(`[data-p="${p}"]`)].map(x => Number(x.value)); v = both; }
      else v = Number(el.value);
    } else v = el.value;
    if (el.type === "password" && !v) delete changed[p]; else changed[p] = v;
    mark();
  });
  const save = async restart => {
    const changes = Object.entries(changed).map(([path, value]) => ({path, value}));
    if (!changes.length) { toast("没有改动"); return; }
    const r = await api("/api/config", {changes});
    if (r.bad && r.bad.length) toast("这些没存上：" + r.bad.join("、"), true);
    if (r.done && r.done.length) { toast(`存好了 ${r.done.length} 项`); Object.keys(changed).forEach(k => delete changed[k]); mark(); }
    if (restart) { const x = await api("/api/bot", {action: "restart"}); toast(x.msg || x.error, !x.ok); }
  };
  $("#save").onclick = () => save(false); $("#saverestart").onclick = () => save(true);
};

VIEWS.people = async main => {
  main.innerHTML = `<h1>群和人</h1><p class="sub">哪些群她说话、哪些人不理。这里改了马上生效 不用重启。群主/管理员在群里让鱼们安静（少说两句 / 关一关 / 闭嘴）她会自己降档，到点自动恢复，这里能看到也能撤销</p><div id="pp"><div class="empty">读取群列表…</div></div>`;
  const draw = async () => {
    const d = await api("/api/people");
    const MODES = [["normal", "正常"], ["quiet", "少说（不主动插话）"], ["at_only", "只在被@时说话"], ["mute", "静音（完全不说）"]];
    const LV = {normal: "正常", quiet: "少说", at_only: "只回@", mute: "静音"};
    const gadm = g => {
      const out = [];
      if (g.admin) out.push(`<span class="badge warn" title="原话：${esc(g.admin.said || "")}">${LV[g.admin.level] || g.admin.level} · ${esc(g.admin.role || "")}「${esc(g.admin.name || "")}」${ago(g.admin.t)}设的 · ${g.admin.until < 0 ? "要有人放开" : "到 " + hm(g.admin.until)}</span> <button class="btn small" data-ca="${g.id}">撤销</button>`);
      if (g.ban) out.push(`<span class="badge warn">${g.ban.whole ? "全员禁言中" : "QQ 禁言中"}${g.ban.until > 0 ? " 到 " + hm(g.ban.until) : ""}</span> <button class="btn small" data-cb="${g.id}" title="已经解了但没收到通知时用">清掉</button>`);
      if (g.eff && g.eff !== g.mode && !g.mute_until) out.push(`<span class="small muted">实际：${LV[g.eff] || g.eff}</span>`);
      return out.join(" ") || '<span class="muted">—</span>';
    };
    $("#pp").innerHTML = `
      <div class="card"><div class="row"><h2 style="margin:0">群</h2><span class="spacer"></span><span class="small muted">${d.online ? "群名是刚从 QQ 读的" : "机器人没开 群名用的是上次存的"}</span></div>
      <table><tr><th>群</th><th>人数</th><th>最近有人说话</th><th>她在这个群</th><th>临时静音</th><th>群管 / QQ 禁言</th></tr>
      ${d.groups.map(g => `<tr><td><b>${esc(g.name || "（没读到群名）")}</b><div class="small muted">${g.id}</div></td><td>${g.members ?? "—"}</td><td>${ago(g.last)}</td>
        <td><select data-g="${g.id}">${MODES.map(([k, n]) => `<option value="${k}" ${g.mode === k ? "selected" : ""}>${n}</option>`).join("")}</select></td>
        <td>${g.mute_until ? `<span class="badge warn">静音到 ${hm(g.mute_until)}</span> <button class="btn small" data-m="${g.id}" data-min="0">取消</button>` :
          `<button class="btn small" data-m="${g.id}" data-min="60">1 小时</button> <button class="btn small" data-m="${g.id}" data-min="480">8 小时</button>`}</td>

    if (a === "open") { const r = await api("/api/tool", {name: "open_songs"}); toast(r.msg || r.error, !r.ok); return; }
    if (a === "refresh") return draw();
    if (a === "import") {
      const link = b.dataset.link || $("#sgl").value.trim();
      if (!link) { toast("先粘贴 B站 视频链接", true); return; }
      b.setAttribute("disabled", ""); const old = b.textContent; b.textContent = "导入中…（几十秒）";
      const r = await api("/api/songs/import", {link});
      b.removeAttribute("disabled"); b.textContent = old;
      toast(r.ok ? `加好了：《${r.song.name}》` : (r.error || "没导入成"), !r.ok);
      if (r.ok) { $("#sgl") && ($("#sgl").value = ""); draw(); }
      return;
    }
    if (a === "upload") {
      const f = $("#sgf").files[0]; if (!f) { toast("先选一个音频文件", true); return; }
      if (f.size > 80 * 1024 * 1024) { toast("文件太大了（80MB 以内）", true); return; }
      b.setAttribute("disabled", ""); b.textContent = "上传中…";
      const data = await new Promise((ok, bad) => { const rd = new FileReader(); rd.onload = () => ok(rd.result); rd.onerror = bad; rd.readAsDataURL(f); });
      const r = await api("/api/songs/upload", {name: $("#sgn").value.trim(), credit: $("#sgc").value.trim(), filename: f.name, data});
      b.removeAttribute("disabled"); b.textContent = "上传";
      toast(r.ok ? `加好了：《${r.song.name}》` : (r.error || "没传上去"), !r.ok);
      if (r.ok) draw();
      return;
    }
    if (!it) return;
    if (a === "preview") {
      b.setAttribute("disabled", ""); const old = b.textContent; b.textContent = "剪一下…";
      const v = vals(it), r = await api("/api/songs/preview", v);
      b.removeAttribute("disabled"); b.textContent = old;
      if (!r.ok) { toast(r.error || "试听不了", true); return; }
      it.querySelector(".sgplay").innerHTML = `<audio controls autoplay src="${r.url}&t=${Date.now()}"></audio> <span class="small muted">她会唱 ${mmss(r.start)} ~ ${mmss(r.end)} 这段</span>`;
      return;
    }
    let body = vals(it);
    if (a === "default") body = {id: it.dataset.id, default: true};
    if (a === "toggle") body = {id: it.dataset.id, enabled: b.textContent.trim() === "启用"};
    if (a === "delete") {
      if (!confirm("删掉这首？（文件挪到 songs\\_删掉的 里 找得回来）")) return;
      const r = await api("/api/songs/delete", {id: it.dataset.id}); toast(r.ok ? "删了" : (r.error || "没删成"), !r.ok); if (r.ok) draw(); return;
    }
    const r = await api("/api/songs/save", body);
    toast(r.ok ? "存好了（下一句就按这个唱）" : (r.error || "没存上"), !r.ok);
    if (r.ok) draw();
  };
  await draw();
};

const TAGS = ["接话", "表情包", "语音", "唱歌", "动画", "补回", "节奏", "冒泡", "搜索", "学梗", "梗百科", "认AI", "记忆", "心情", "控制台", "QQ", "启动", "B站", "错误"];
function fmtLog(line) {
  let s = esc(line);
  s = s.replace(/^\[(\d\d:\d\d:\d\d)\]/, '<span class="t">[$1]</span>');
  s = s.replace(/\[([^\]\s]{1,8})\]/g, (m, t) => TAGS.some(x => t.startsWith(x)) || t.startsWith("模型") ? `<span class="tag">[${t}]</span>` : m);
  if (/出错|失败|Traceback|Error|异常|超时/.test(line)) s = `<span class="err">${s}</span>`;
  return s;
}

    if (stick) box.scrollTop = box.scrollHeight;
  };
  main.querySelector(".row").onclick = e => { const t = e.target.dataset.t; if (!t) return; on.has(t) ? on.delete(t) : on.add(t); e.target.classList.toggle("on"); load(); };
  $("#lq").onchange = load; $("#ln").onchange = load; $("#lr").onclick = load;
  await load(); $("#lb").scrollTop = 1e7;
  every(3000, () => { if ($("#auto") && $("#auto").checked) load(); });
};

/* ───────── 人设 ───────── */
VIEWS.persona = async main => {
  const r = await api("/api/persona");
  main.innerHTML = `<h1>人设</h1><p class="sub">persona.md —— 她是谁、怎么说话。保存后她下一次回复就用新的（不用重启）；每次保存都会留一份备份</p>
    <div class="card"><textarea id="pt" rows="28" style="font:13px/1.65 Consolas,'Microsoft YaHei UI',monospace">${esc(r.text || "")}</textarea>
    <div class="row" style="margin-top:10px"><span class="muted small" id="pc"></span><span class="spacer"></span><button class="btn" id="po">打开备份文件夹</button><button class="btn primary" id="ps">保存</button></div></div>`;
  const cnt = () => $("#pc").textContent = `${$("#pt").value.length} 字`; $("#pt").oninput = cnt; cnt();
  $("#ps").onclick = async () => { const x = await api("/api/persona", {text: $("#pt").value}); toast(x.ok ? "存好了 下一句话就用新人设" : x.error, !x.ok); };
  $("#po").onclick = async () => { const x = await api("/api/tool", {name: "open_backups"}); toast(x.msg || x.error, !x.ok); };
};

/* ───────── 工具 ───────── */
VIEWS.tools = async main => {
  main.innerHTML = `<h1>工具</h1><p class="sub">一些偶尔用的东西</p>
    <div class="card"><h2>试音</h2><div class="row"><input type="text" id="tt" value="本鱼开嗓啦 今天也要好好吃饭哦" style="flex:1"><select id="te"><option value="">自动语气</option>${["开心", "撒娇", "难过", "生气", "惊讶", "平静", "困"].map(x => `<option>${x}</option>`).join("")}</select><button class="btn primary" id="tg">合成</button></div>
      <div id="ta" style="margin-top:10px" class="small muted">用现在的音色设置合成一句 在这里播放（不发出去 不算条数）</div></div>
    <div class="card"><h2>在电脑上打开</h2><div class="row">
      <button class="btn" data-tool="import_stickers">导入表情包（导入表情包.bat）</button>
      <button class="btn" data-tool="install_voice">安装语音听写（安装语音.bat）</button>
      <button class="btn" data-tool="open_logs">打开机器人文件夹</button>
      <button class="btn" data-tool="open_data">打开数据文件夹</button>
      <button class="btn" data-tool="open_backups">打开控制台备份</button></div>
      <p class="small muted">改设置、人设、记忆之前 控制台都会自动备份一份到 backup_20261024\\panel_backups</p></div>`;
  $("#tg").onclick = async () => {
    $("#ta").textContent = "合成中…"; const r = await api("/api/tts", {text: $("#tt").value, emo: $("#te").value});
    $("#ta").innerHTML = r.ok ? `<audio controls autoplay src="/voicefile?f=${encodeURIComponent(r.file)}&t=${Date.now()}"></audio> <span class="muted">${r.secs.toFixed(1)} 秒</span>` : `<span style="color:var(--bad)">${esc(r.error)}</span>`;
  };
  main.onclick = async e => { const t = e.target.dataset.tool; if (!t) return; const r = await api("/api/tool", {name: t}); toast(r.msg || r.error, !r.ok); };
};

pollFoot(); setInterval(pollFoot, 15000);
render();
</script>
