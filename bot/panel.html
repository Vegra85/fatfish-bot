<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23e2f2f8%22/%3E%3Cpath%20d%3D%22M51%2032c-3.5-8-11.5-12.5-20-12.5C22%2019.5%2015.5%2024.5%2012.5%2032c3%207.5%209.5%2012.5%2018.5%2012.5%208.5%200%2016.5-4.5%2020-12.5z%22%20fill%3D%22%231a86b8%22/%3E%3Cpath%20d%3D%22M49.5%2032%2058%2024.5v15z%22%20fill%3D%22%231a86b8%22/%3E%3Ccircle%20cx%3D%2221.5%22%20cy%3D%2229%22%20r%3D%223%22%20fill%3D%22%230b2530%22/%3E%3C/svg%3E">
<style>
/* 她的名字主题（10-27）：潮汐蓝绿 + 珊瑚色点缀；深色模式跟着系统。
   图表的五个系列色（--c1..--c5）按 dataviz 的校验跑过：浅色 / 深色 相邻色盲可分（ΔE ≥ 8）、对卡片底色对比度 ≥ 3:1 */
:root{
  color-scheme:light;
  --bg:#eef4f6; --bg-top:#dbedf3; --panel:#ffffff; --panel2:#f4f8fa; --ink:#12222b; --ink2:#2e4450; --muted:#5c707b;
  --line:#dbe6eb; --line2:#c4d5dc;
  --accent:#0f6d93; --accent-hi:#1a86b8; --accent-ink:#ffffff; --soft:#e2f2f8;
  --coral:#b5462a; --coral-hi:#ef6c4a; --coral-soft:#fdeee9;
  --good:#077a4d; --good-soft:#e2f5ec; --warn:#8f5a00; --warn-soft:#fff2d9; --bad:#bd2e37; --bad-soft:#fde8e9;
  --shadow:0 1px 2px rgba(17,45,58,.06),0 12px 30px -18px rgba(17,62,82,.30);
  --shadow-hi:0 2px 4px rgba(17,45,58,.08),0 18px 40px -18px rgba(17,62,82,.40);
  --hero:linear-gradient(118deg,#d9eef7 0%,#eaf7f4 50%,#fdece5 100%);
  --ring:0 0 0 3px rgba(26,134,184,.22);
  --c1:#1a86b8; --c2:#ef6c4a; --c3:#1aa58a; --c4:#bd8300; --c5:#8a63d6; --spark:#9fb4bd;
  --nav-w:216px; --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0a1216; --bg-top:#0e1d23; --panel:#101c21; --panel2:#15242a; --ink:#e3eef2; --ink2:#b9cbd2; --muted:#8aa1aa;
  --line:#1f323a; --line2:#2c444e;
  --accent:#56c2e3; --accent-hi:#2f97c9; --accent-ink:#06202a; --soft:#123039;
  --coral:#ff8a72; --coral-hi:#e8603f; --coral-soft:#33201b;
  --good:#3fcf8f; --good-soft:#0f2a1f; --warn:#f2b54f; --warn-soft:#2d2413; --bad:#ff6d74; --bad-soft:#32181b;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -20px rgba(0,0,0,.75);
  --shadow-hi:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.85);
  --hero:linear-gradient(118deg,#0f2b35 0%,#10262c 55%,#2a1c19 100%);
  --ring:0 0 0 3px rgba(86,194,227,.25);
  --c1:#2f97c9; --c2:#e8603f; --c3:#1f9e84; --c4:#b98000; --c5:#8f78e0; --spark:#4d6873;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:linear-gradient(180deg,var(--bg-top) 0,var(--bg) 380px);background-repeat:no-repeat;color:var(--ink);
  font:14px/1.6 "Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent-hi) 25%,transparent)}
.app{display:flex;min-height:100vh}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-3px}

/* ── 侧边栏 ── */
nav{width:var(--nav-w);flex:none;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;gap:12px;align-items:center;padding:20px 16px 12px}
.ava{position:relative;width:46px;height:46px;flex:none}
.ava-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--soft)}
.ava-in img,.ava-in svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ava-in img{z-index:1}
.ava::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--line2);transition:border-color .2s}
.ava .st{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--muted);border:2.5px solid var(--panel);z-index:2}
.ava.on::after{border-color:color-mix(in srgb,var(--good) 70%,transparent)} .ava.on .st{background:var(--good)}
.ava.warn::after{border-color:color-mix(in srgb,var(--warn) 70%,transparent)} .ava.warn .st{background:var(--warn)}
.ava.bad::after{border-color:color-mix(in srgb,var(--bad) 70%,transparent)} .ava.bad .st{background:var(--bad)}
.bname{min-width:0}
.bname b{display:block;font-size:17px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.bstate{margin:0 14px 8px;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--ink2);display:flex;gap:7px;align-items:center;line-height:1.35}
.bstate .ic{width:16px;height:16px;color:var(--accent);align-self:flex-start;margin-top:1px}
.bstate b{font-weight:600;color:var(--ink)}
.bstate .muted{font-size:11px;white-space:nowrap}
.ngroup{padding:12px 22px 4px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 12px;margin:1px 10px;border-radius:10px;color:var(--ink2);font-size:14px;position:relative;transition:background .15s,color .15s}
nav button .ic{opacity:.85}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
nav button.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
nav button:focus-visible{box-shadow:var(--ring)}
.navfoot{margin-top:auto;padding:12px 16px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.navfoot a.badge{text-decoration:none}
.badge .ic{width:13px;height:13px}

/* ── 页面 ── */
main{flex:1;min-width:0;padding:26px 30px 64px;max-width:1220px}
main > h1{display:flex;align-items:center;gap:12px;font-size:22px;margin:0 0 2px;letter-spacing:.3px}
.hico{width:40px;height:40px;border-radius:13px;display:inline-grid;place-items:center;background:var(--hero);color:var(--accent);border:1px solid var(--line);box-shadow:var(--shadow);flex:none}
.hico .ic{width:20px;height:20px}
.sub{color:var(--muted);margin:2px 0 20px 52px;max-width:900px}
h1:not(:has(.hico)) + .sub{margin-left:0}
h2{font-size:15px;margin:0 0 10px;font-weight:650;letter-spacing:.2px}
h2 .ic{width:16px;height:16px;color:var(--accent);margin-right:6px;vertical-align:-2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card.alert{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad-soft) 60%,var(--panel))}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:16px}
.qq{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.qq .qr{width:232px;height:232px;flex:none;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)}
.qq ol li{margin:3px 0}
.cols{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.cols > .card,.cols > div > .card:last-child{margin-bottom:0}
.cols{margin-bottom:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}:root{--nav-w:188px}}
.stat{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.stat b{display:block;font-size:26px;font-weight:650;line-height:1.2;letter-spacing:-.2px;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:12px}
.stat .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:6px}
.stat .lbl .ic{width:15px;height:15px;color:var(--accent)}
.stat .spark{display:block;width:100%;height:auto;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;white-space:nowrap;
  transition:border-color .15s,background .15s,color .15s,box-shadow .15s,filter .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.btn:focus-visible{box-shadow:var(--ring)}
.btn .ic{width:15px;height:15px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#ffffff),var(--accent));border-color:var(--accent);color:var(--accent-ink);
  box-shadow:0 8px 16px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);line-height:1.6}
.badge.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.acc{background:var(--soft);color:var(--accent);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:12px}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-hi);box-shadow:var(--ring)}
textarea{width:100%;resize:vertical}
input[type=number]{width:96px}
input[type=range]{accent-color:var(--accent-hi)}
.sw{position:relative;width:40px;height:23px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.18s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--accent-hi)}
.sw input:checked+span:before{transform:translateX(17px)}
.sw input:focus-visible+span{box-shadow:var(--ring)}
.set{display:flex;gap:14px;align-items:center;padding:11px 10px;margin:0 -10px;border-top:1px solid var(--line);border-radius:10px;transition:background .15s}
.set:hover{background:var(--panel2)}
.set:first-of-type{border-top:0}
.set .lab{flex:1;min-width:0}
.set .lab b{font-weight:600}
.set .lab div{color:var(--muted);font-size:12px}
.set.changed{background:color-mix(in srgb,var(--warn-soft) 70%,transparent)}
.set.changed .lab b:after{content:" ·改了";color:var(--warn);font-weight:400;font-size:12px}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;border-top:0;background:var(--panel2);white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
tbody tr:hover td,table tr:hover > td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
td{font-variant-numeric:tabular-nums}
.list{max-height:70vh;overflow:auto}
.item{padding:9px 11px;border-radius:10px;cursor:pointer;transition:background .15s}
.item:hover{background:var(--panel2)}
.item.on{background:var(--soft)}
.fact{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .t{flex:1}
.chat{font-size:13px;max-height:420px;overflow:auto;background:var(--panel2);border-radius:12px;padding:10px 12px}
.chat div{padding:2px 0}
.chat .me{color:var(--accent)}
.logbox{font:12px/1.65 Consolas,"Cascadia Mono",monospace;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;height:66vh;overflow:auto;white-space:pre-wrap;word-break:break-all}
.logbox .tag{color:var(--accent);font-weight:600}
.logbox .err{color:var(--bad)}
.logbox .t{color:var(--muted)}
.chip{all:unset;cursor:pointer;padding:4px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;background:var(--panel);transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--accent-hi);color:var(--accent)}
.chip.on{background:var(--soft);color:var(--accent);border-color:transparent;font-weight:600}
.chip:focus-visible{box-shadow:var(--ring)}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.stk .s{border:1px solid var(--line);border-radius:12px;padding:7px;background:var(--panel);cursor:pointer;text-align:center;position:relative;transition:transform .12s,box-shadow .12s}
.stk .s:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stk .s.off{opacity:.38}
.stk .s.pick{outline:2px solid var(--accent-hi)}
.stk img{width:100%;height:88px;object-fit:contain;display:block;border-radius:8px;background:var(--panel2)}
.stk .n{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .e{font-size:11px;color:var(--muted)}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:30}
#toast div{background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;max-width:440px;box-shadow:0 14px 34px -12px rgba(0,0,0,.4);animation:tin .2s ease-out}
#toast div.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.savebar{position:sticky;bottom:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow-hi)}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:14px;height:3px;border-radius:2px;vertical-align:3px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.secret{display:flex;gap:6px;align-items:center}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.more>summary{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;user-select:none}
.more>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.more[open]>summary::before{transform:rotate(45deg)}
.more>summary:hover{color:var(--accent)}

/* ── 总览：她现在怎么样 ── */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;background:var(--hero);border:1px solid var(--line);
  border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}
.hero .me{display:flex;gap:18px;align-items:center;position:relative;z-index:1;min-width:0}
.hero .ava{width:84px;height:84px}
.hero .ava .st{width:18px;height:18px;border-width:3px}
.hname{font-size:24px;font-weight:700;letter-spacing:.5px;line-height:1.25}
.hname small{font-size:12px;font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--panel) 72%,transparent);border:1px solid var(--line);font-size:12px;color:var(--ink2);backdrop-filter:blur(4px)}
.pill .ic{width:14px;height:14px;color:var(--accent)}
.pill.hot{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.hot .ic{color:var(--warn)}
.how{color:var(--ink2);font-size:13px;max-width:440px}
.hfacts{display:grid;gap:8px;align-content:center;position:relative;z-index:1;min-width:0}
.hf{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:13px;background:color-mix(in srgb,var(--panel) 74%,transparent);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);font-size:13px;backdrop-filter:blur(4px)}
.hf > .ic{width:17px;height:17px;color:var(--accent);margin-top:2px}
.hf .k{color:var(--muted);font-size:12px;line-height:1.3}
.hf.warn{background:color-mix(in srgb,var(--warn-soft) 85%,transparent)}
.hf.warn > .ic{color:var(--warn)}
.hero .wave{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:70px;pointer-events:none;opacity:.55}
@media (max-width:1000px){.hero{grid-template-columns:1fr}}
.kic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--accent);flex:none}
.kic .ic{width:17px;height:17px}
.boot>summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink);font-size:14px}
.boot>summary:hover{color:var(--ink)}
.boot>summary h2{margin:0}
.boot[open]>summary{margin-bottom:8px}
.bootrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.moodbig{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.5px}

/* ── 火力全开 ── */
.fpcard.on{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:color-mix(in srgb,var(--warn-soft) 45%,var(--panel))}
.fpbar{position:relative;margin:14px 2px 30px}
.fpbar input[type=range]{width:100%;margin:0;accent-color:var(--accent-hi);cursor:pointer;height:22px}
.fpbar input[type=range]:disabled{cursor:not-allowed;opacity:.5}
.fpticks{position:absolute;left:8px;right:8px;top:26px;height:16px;font-size:11px;color:var(--muted);pointer-events:none}
.fpticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.fpticks span:first-child{transform:none}
.fpticks span:last-child{transform:translateX(-100%)}
.fpticks span::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:var(--line2)}
.fpticks span:first-child::before{left:0}
.fpticks span:last-child::before{left:100%}
@media (max-width:700px){.fpticks span.minor{display:none}}
.fpst{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.fpcard.on .fpst{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fpst .big{font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;opacity:.45}
.dot.on{background:var(--warn);opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--warn) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.dot.on,#toast div{animation:none}}
.fpwarn{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.upbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.upbar.info{background:var(--soft);border-color:transparent}

/* ── 日历 ── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
.cal-c{min-height:88px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:var(--panel2);overflow:hidden;min-width:0;transition:border-color .15s}
.cal-c:hover{border-color:var(--line2)}
.cal-c.off{background:transparent;border-color:transparent}
.cal-c.today{border-color:var(--accent-hi);box-shadow:0 0 0 1px var(--accent-hi) inset;background:color-mix(in srgb,var(--soft) 55%,var(--panel))}
.cal-d{font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600}
.cal-c.today .cal-d{color:var(--accent)}
.cal-e{font-size:11px;padding:1px 6px;border-radius:6px;margin:2px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel);border:1px solid var(--line)}
.cal-e:hover{border-color:var(--accent-hi)}
.cal-e.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.cal-e.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.cal-e.acc{background:var(--soft);border-color:transparent;color:var(--accent)}
.cal-e.sel{outline:2px solid var(--accent-hi)}
.cols.calcols{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:900px){.cols.calcols{grid-template-columns:minmax(0,1fr)}.cal-c{min-height:64px}}
.tline{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.tline:first-of-type{border-top:0}

/* ── 图表的悬停 ── */
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;box-shadow:var(--shadow-hi);font-size:12px;min-width:130px;max-width:300px;opacity:0;transition:opacity .08s;left:0;top:0}
#tip.on{opacity:1}
#tip .tt{color:var(--muted);margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;line-height:1.7}
#tip .tr i{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
#tip .tr b{font-weight:650;color:var(--ink)}
#tip .tr span{color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.chart .hit{fill:transparent;cursor:crosshair;outline:none}
.chart .band{fill:var(--panel2);opacity:0;transition:opacity .1s}
.chart .band.on{opacity:1}
.chart .xh{stroke:var(--line2);stroke-width:1;opacity:0}
.chart .xh.on{opacity:1}

/* ── 窄窗口：侧边栏只剩图标 ── */
@media (max-width:760px){
  :root{--nav-w:66px}
  .brand{justify-content:center;padding:16px 0 10px}
  .bname,.bstate,.ngroup,nav button .lb,.navfoot{display:none}
  nav button{justify-content:center;margin:2px 9px;padding:10px 0}
  nav button.on::before{left:-9px}
  main{padding:18px 16px 50px}
  .sub{margin-left:0}
  .hero{padding:18px}
  .hero .ava{width:64px;height:64px}
}

<body>
<div class="app">

<script>

];
const PAGES = NAV.flatMap(([, xs]) => xs.map(([k, n]) => [k, n]));
const PAGE_ICON = Object.fromEntries(NAV.flatMap(([, xs]) => xs.map(([k, , ic]) => [k, ic])));
// 线条图标（自己画的 24×24）
const ICONS = {
  home: '<path d="M4 11.2 12 4.8l8 6.4V19a1 1 0 0 1-1 1h-4.6v-5.6H9.6V20H5a1 1 0 0 1-1-1z"/>',

  chart: '<path d="M4.5 19.5h15"/><path d="M7.5 16v-4.5M12 16V7.5M16.5 16v-7"/>',
  heart: '<path d="M12 19.2s-7-4.2-7-9.3a3.8 3.8 0 0 1 7-2.1 3.8 3.8 0 0 1 7 2.1c0 5.1-7 9.3-7 9.3z"/>',
  card: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="11" r="2.1"/><path d="M5.9 16c.6-1.5 1.7-2.3 3.1-2.3s2.5.8 3.1 2.3M14.5 10h3.5M14.5 13.5h2.5"/>',
  smile: '<circle cx="12" cy="12" r="8"/><path d="M8.7 14.1c.8 1.1 2 1.8 3.3 1.8s2.5-.7 3.3-1.8M9.4 9.8v.4M14.6 9.8v.4"/>',
  music: '<path d="M9.5 17V6.2l9.5-1.9v10.6"/><circle cx="7.2" cy="17" r="2.3"/><circle cx="16.7" cy="14.9" r="2.3"/>',
  users: '<circle cx="9" cy="8.8" r="3"/><path d="M3.8 18.6c.7-2.8 2.7-4.4 5.2-4.4s4.5 1.6 5.2 4.4"/><path d="M15.4 6.1a3 3 0 0 1 0 5.4M17 14.3c1.7.5 2.8 1.9 3.2 4.3"/>',
  send: '<path d="M20 4 3.8 10.4l6.6 3 3 6.6z"/><path d="M20 4 10.4 13.4"/>',
  sliders: '<path d="M4.5 7h9.5M18 7h1.5M4.5 17h3M12 17h7.5"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  wallet: '<path d="M6 5h9.5a1 1 0 0 1 1 1v1.5"/><rect x="4" y="7.5" width="16" height="11.5" rx="2.5"/><path d="M15.5 13.2h2"/>',
  list: '<path d="M9 7h10.5M9 12h10.5M9 17h10.5M4.8 7v.01M4.8 12v.01M4.8 17v.01"/>',
  wrench: '<path d="M14.6 5.6a4 4 0 0 0-5 5.1L4.7 15.6a1.7 1.7 0 0 0 2.4 2.4l4.9-4.9a4 4 0 0 0 5.1-5l-2.4 2.4-2.3-.5-.5-2.3z"/>',
  msg: '<path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7.5L7 20.5v-3H5A1.5 1.5 0 0 1 3.5 16V8A1.5 1.5 0 0 1 5 6.5z"/>',
  reply: '<path d="M10 7 5 11.5l5 4.5"/><path d="M5.5 11.5H14a5 5 0 0 1 5 5v1"/>',
  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v3"/>',
  link: '<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
  coin: '<circle cx="12" cy="12" r="8"/><path d="M9.3 8.8 12 12l2.7-3.2M12 12v4.6M9.4 12.6h5.2M9.4 15h5.2"/>',
  gauge: '<path d="M4.5 16.5a7.5 7.5 0 1 1 15 0"/><path d="m12 16.5 3.6-4.3"/>',
  moon: '<path d="M18.5 14.6A7 7 0 0 1 9.4 5.5a7 7 0 1 0 9.1 9.1z"/>',
  sun: '<circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/>',
  bolt: '<path d="M13 3.5 5.5 13.5h6l-1 7 7.5-10h-6z"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
  pulse: '<path d="M3.5 12h4l2-5 4 10 2-5h5"/>',
  bot: '<rect x="5" y="8" width="14" height="10.5" rx="3"/><path d="M12 4.5V8M9.5 13v.01M14.5 13v.01M2.5 12.5v2M21.5 12.5v2"/>',
  sparkle: '<path d="M12 4l1.8 4.6L18.5 10l-4.7 1.6L12 16.5l-1.8-4.9L5.5 10l4.7-1.4z"/>',
  alert: '<path d="M12 4.5 3.5 19h17z"/><path d="M12 10v4M12 16.6v.01"/>',
  check: '<path d="m5.5 12.5 4 4 9-9"/>',
};
function icon(n, cls = "ic") {
  const p = ICONS[n];
  return p ? `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>` : "";
}
// 没放头像时的默认头像：一条胖鱼（公开版没有作者的头像 也用这个）
let FISH_N = 0;
function fishSVG() {
  const id = "fg" + (++FISH_N);
  return `<svg class="fish" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd0ea"/><stop offset="1" stop-color="#1a86b8"/></linearGradient></defs>
    <rect width="64" height="64" fill="var(--soft)"/>
    <path d="M51 32c-3.5-8-11.5-12.5-20-12.5C22 19.5 15.5 24.5 12.5 32c3 7.5 9.5 12.5 18.5 12.5 8.5 0 16.5-4.5 20-12.5z" fill="url(#${id})"/>
    <path d="M49.5 32 58 24.5v15z" fill="url(#${id})"/>
    <circle cx="21.5" cy="29" r="2.9" fill="#0b2530"/><circle cx="22.4" cy="28.1" r=".9" fill="#fff"/>
    <path d="M30 25.5c-2.2 4-2.2 9 0 13" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".55"/>
    <circle cx="13" cy="19" r="2.2" fill="none" stroke="#2ea9d1" stroke-width="1.4"/><circle cx="8.5" cy="25" r="1.3" fill="none" stroke="#2ea9d1" stroke-width="1.2"/></svg>`;
}
function avatarHTML(has = true) {   // has：后台说有没有 avatar.png（没有就不去要 免得每次刷新都 404）
  return `<span class="ava-in">${fishSVG()}${has ? '<img src="/avatar" alt="" onerror="this.remove()">' : ""}</span>`;
}
const WAVE = `<svg class="wave" viewBox="0 0 600 70" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 38c60-20 120-20 180 0s120 20 180 0 120-20 180 0 60 10 60 10v32H0z" fill="var(--accent-hi)" opacity=".10"/>
  <path d="M0 50c70-16 140-16 210 0s140 16 210 0 120-12 180 0v20H0z" fill="var(--coral-hi)" opacity=".08"/></svg>`;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Panel": "1"}, body: JSON.stringify(body)};
  try { const r = await fetch(path, opt); return await r.json(); }
  catch (e) { return {ok: false, error: "控制台没响应（黑窗口关了？）"}; }
}
async function wipeFlow(uid, name) {
  const pv = await api(`/api/wipe/preview?uid=${encodeURIComponent(uid)}`);
  if (!pv.ok) { toast(pv.error || "读不到", true); return false; }
  if (!confirm(`真的删掉「${name || uid}」的所有数据？\n\n会删：${pv.text}\n群里别人提到他的地方会换成「某人」；共享印象会清掉重新提炼。\n\n真删 不留备份 找不回来。`)) return false;
  const r = await api("/api/wipe", {uid});
  toast(r.ok ? "删好了：" + (r.text || "") + (r.offline ? "（机器人没开 直接删的文件）" : "") : (r.error || "没删成"), !r.ok);
  return r.ok;
}
function toast(msg, bad = false) {
  const d = document.createElement("div"); d.textContent = msg; if (bad) d.className = "bad";
  $("#toast").appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3500);
}
function ago(ts) {
  if (!ts) return "—";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "刚刚"; if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前"; if (d < 172800) return "昨天";
  const t = BJ(ts); return `${t.m}-${t.d}`;
}
// 北京时间（10-27 小明：以后总时区以北京时间为准 —— 控制台上的时间都按北京时间显示 不管这台电脑在哪）
function BJ(ts) { const d = new Date((ts + 8 * 3600) * 1000); return {y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), H: d.getUTCHours(), M: d.getUTCMinutes(), wd: (d.getUTCDay() + 6) % 7}; }
const bjts = (y, m, d, H = 0, M = 0) => Date.UTC(y, m - 1, d, H, M) / 1000 - 8 * 3600;
const pad2 = n => String(n).padStart(2, "0");
const bjday = ts => { const t = BJ(ts); return `${t.y}-${pad2(t.m)}-${pad2(t.d)}`; };
const bjhm = ts => { const t = BJ(ts); return `${pad2(t.H)}:${pad2(t.M)}`; };
function hm(ts) { const t = BJ(ts); return `${t.m}-${t.d} ${pad2(t.H)}:${pad2(t.M)}`; }
function whenText(ts) {
  const a = BJ(ts), b = BJ(Date.now() / 1000);
  const days = Math.round((Date.UTC(a.y, a.m - 1, a.d) - Date.UTC(b.y, b.m - 1, b.d)) / 86400000);
  const t = `${pad2(a.H)}:${pad2(a.M)}`;
  if (days === 0) return "今天 " + t; if (days === 1) return "明天 " + t; if (days === 2) return "后天 " + t; if (days === -1) return "昨天 " + t;
  return `${a.y !== b.y ? a.y + "-" : ""}${a.m}-${a.d}（周${"一二三四五六日"[a.wd]}）${t}`;
}
function dur(sec) { sec = Math.max(0, Math.floor(sec)); if (sec < 3600) return Math.floor(sec / 60) + " 分钟"; if (sec < 86400) return (sec / 3600).toFixed(1) + " 小时"; return (sec / 86400).toFixed(1) + " 天"; }
const money = v => "$" + (v || 0).toFixed(v >= 1 ? 2 : 3);
const num = v => (v || 0).toLocaleString();
let timers = [], RENDER = 0;   // RENDER：第几次换页（换页后 上一页还没跑完的那些不再动页面）
function every(ms, fn) {
  const my = RENDER;
  const id = setInterval(() => { if (my !== RENDER) { clearInterval(id); return; } fn(); }, ms);
  timers.push(id);
}
function clearTimers() { timers.forEach(clearInterval); timers = []; }

/* ───────── 导航 ───────── */
function nav() {
  const cur = location.hash.slice(1) || "overview";
  $("#nav").innerHTML = NAV.map(([g, xs]) => `<div class="ngroup">${g}</div>` + xs.map(([k, n, ic]) =>
    `<button class="${k === cur ? "on" : ""}" data-p="${k}" title="${n}" aria-label="${n}"${k === cur ? ' aria-current="page"' : ""}>${icon(ic)}<span class="lb">${n}</span></button>`).join("")).join("");
  $("#nav").onclick = e => { const b = e.target.closest("[data-p]"); if (b) location.hash = b.dataset.p; };
}
function decorate() {            // 每页的大标题前面加这一页的图标（页面一画出来就加 不等数据）
  const h = $("#main > h1"); if (!h || h.querySelector(".hico")) return;
  const ic = PAGE_ICON[location.hash.slice(1) || "overview"]; if (!ic) return;
  h.insertAdjacentHTML("afterbegin", `<span class="hico">${icon(ic)}</span>`);
}
window.addEventListener("hashchange", render);
async function render() {
  const my = ++RENDER;
  clearTimers(); nav();
  const cur = location.hash.slice(1) || "overview";
  const fn = VIEWS[cur] || VIEWS.overview;
  $("#main").onclick = null;
  $("#main").innerHTML = '<div class="empty">加载中…</div>';
  try { await fn($("#main")); if (my === RENDER) upBanner(); } catch (e) {
    if (my !== RENDER) return;          // 页面还没加载完就点了别的页：上一页剩下的不管了（以前会报「Cannot set properties of null」）
    console.error(e);
    $("#main").innerHTML = `<div class="card">出错了：${esc(e)}<div class="small muted" style="margin-top:6px">刷新一下页面再试；还这样就把这句话发给 Claude</div></div>`;
  }
}
let BOT = {bot: "offline"};
function herName(o) { return ((o && o.her) || {}).name || ((o && o.mood) || {}).nick || "大肥鱼"; }
function statusCls(o) {          // 头像那圈的颜色：在线 = 绿；QQ 要扫码 / 没开 = 红；卡住 / 登录中 = 黄；没在运行 = 灰
  const q = ((o && o.qq) || {}).state;
  if (q === "scan" || q === "off" || o.bot === "error") return "bad";
  if (o.bot === "online" && ((o.info || {}).connected === false || q === "starting")) return "warn";
  if (o.bot === "stuck" || (o.bot !== "online" && q === "starting")) return "warn";
  return o.bot === "online" ? "on" : "";
}
function brand(o) {
  const name = herName(o), h = o.her || {};
  $("#bname").textContent = name;
  const ava = $("#bava"); if (ava) ava.className = "ava " + statusCls(o);
  const asleep = /睡/.test(h.state || "");
  const up = o.bot === "online";
  const run = up ? "在线" : o.bot === "stuck" ? "机器人卡住了" : "机器人没在运行";
  $("#bstate").innerHTML = h.state ? `${icon(asleep ? "moon" : "sun")}<div><b>${esc(h.state)}</b><div class="muted">${run} · ${esc(h.tz === "北京时间" ? "北京" : h.tz || "")} ${bjhm(Date.now() / 1000)}</div></div>`
    : `${icon("bot")}<div>${run}</div>`;
  if (h.avatar && !$("#bavain img")) $("#bavain").insertAdjacentHTML("beforeend", '<img src="/avatar" alt="" onerror="this.remove()">');
}
async function pollFoot() {
  const o = await api("/api/overview");
  if (!o || o.ok === false && !o.bot) { $("#navfoot").innerHTML = '<span class="badge bad">控制台没响应</span>'; $("#bstate").textContent = "控制台没响应"; return; }
  BOT = o;
  const m = {online: ["good", "机器人运行中"], offline: ["", "机器人没在运行"], stuck: ["warn", "进程在 但没响应"], error: ["bad", "接口出错"]}[o.bot] || ["", o.bot];
  const q = QQS[(o.qq || {}).state] || ["", "QQ 状态不明"];
  const fs = fpState(o).full, fon = fs && fs.on && (fs.until < 0 || fs.until > Date.now() / 1000);
  $("#navfoot").innerHTML = `<span class="badge ${m[0]}">${m[1]}</span><a href="#overview" class="badge ${q[0]}">${q[1]}</a>` +
    (fon ? `<a href="#overview" class="badge warn" title="点这里去总览页关掉">${icon("bolt")}火力全开中 · ${fs.until < 0 ? "一直开" : "还剩 " + fpShort(fs.until - Date.now() / 1000)}</a>` : "") +
    (o.app_version ? `<span class="small muted" title="版本号（发布到 GitHub 的那个）">v${esc(o.app_version)}</span>` : "");
  brand(o);
  checkVersion();
  document.title = ((o.qq || {}).state === "scan" ? "⚠ QQ 要扫码 · " : "") + herName(o) + " · 控制台";

/* ───────── 控制台后台的版本：旧版本 → 提示换；页面改了 → 提示刷新 ───────── */
const VER = {html: null, old: false, changed: false, busy: false};
async function checkVersion() {
  if (VER.busy) return;
  VER.busy = true;
  try {
    const v = await api("/api/version");
    if (v && v.version) {
      VER.old = false;
      if (VER.html === null) VER.html = v.html;
      VER.changed = !!v.html && v.html !== VER.html;
    } else if (v && v.error === "没有这个页面") VER.old = true;
  } finally { VER.busy = false; }
  upBanner();
}
function upBanner() {
  const main = $("#main"); if (!main) return;
  let el = $("#upbar");
  const html = VER.old ? `<span><b>控制台后台还是旧版本</b>，有的按钮会显示「不认识的设置」。双击 <b>C:\\QQBot\\控制台.bat</b> 换成新版本（它会自己把旧的关掉；旧的黑窗口显示 Control panel stopped 时关掉就行）。换过一次以后会自己更新。</span>` :
    VER.changed ? `<span>控制台更新了</span><button class="btn small primary" onclick="location.reload()">刷新页面</button>` : "";
  if (!html) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "upbar"; main.prepend(el); }
  el.className = "upbar" + (VER.old ? "" : " info");
  el.innerHTML = html;
}

VIEWS.settings = async main => {
  const r = await api("/api/config"); const C = r.config || {};
  const changed = {};
  main.innerHTML = `<h1>功能开关</h1><p class="sub">改完点下面的「保存」。大部分设置要重启机器人才生效（重启只要十几秒 QQ 不会掉线）</p><div id="sets"></div>
    <div class="savebar"><span id="chg" class="muted">没有改动</span><span class="spacer"></span><button class="btn" id="save">保存</button><button class="btn primary" id="saverestart">保存并重启机器人</button></div>`;
  $("#sets").innerHTML = SETTINGS.map(([sec, rows]) => `<div class="card"><h2>${sec}</h2>${rows.map(([p, lab, desc, type, a, b, c]) => {
    const v = getp(C, p); let ctl = "";
    if (type === "bool") ctl = `<label class="sw"><input type="checkbox" data-p="${p}" ${v ? "checked" : ""}><span></span></label>`;
    else if (type === "num") ctl = `<input type="number" data-p="${p}" value="${v ?? ""}" min="${a}" max="${b}" step="${c}">`;
    else if (type === "text") ctl = `<input type="text" data-p="${p}" value="${esc(v ?? "")}" style="width:260px">`;
    else if (type === "select") ctl = `<select data-p="${p}">${a.map(([k, n]) => `<option value="${esc(k)}" ${String(v ?? "") === k ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    else if (type === "pair") ctl = `<span class="row"><input type="number" data-p="${p}" data-i="0" value="${(v || [])[0] ?? ""}" min="${a}" max="${b}" step="${c}"> 点到 <input type="number" data-p="${p}" data-i="1" value="${(v || [])[1] ?? ""}" min="${a}" max="${b}" step="${c}"> 点</span>`;
    else if (type === "secret") ctl = `<span class="secret">${v && v.set ? '<span class="badge good">已填</span>' : '<span class="badge warn">没填</span>'}<input type="password" data-p="${p}" placeholder="要换就填新的" style="width:220px"></span>`;
    return `<div class="set" data-row="${p}"><div class="lab"><b>${esc(lab)}</b>${desc ? `<div>${esc(desc)}</div>` : ""}</div>${v === undefined && type !== "secret" ? '<span class="badge">配置里没有</span>' : ctl}</div>`;
  }).join("")}</div>`).join("");
  const mark = () => { const n = Object.keys(changed).length; $("#chg").textContent = n ? `改了 ${n} 项还没保存` : "没有改动"; document.querySelectorAll(".set").forEach(el => el.classList.toggle("changed", el.dataset.row in changed)); };
  $("#sets").addEventListener("input", e => {
    const el = e.target, p = el.dataset.p; if (!p) return;
    let v;
    if (el.type === "checkbox") v = el.checked;
    else if (el.type === "number") {
      if (el.dataset.i !== undefined) { const both = [...document.querySelectorAll(`[data-p="${p}"]`)].map(x => Number(x.value)); v = both; }
      else v = Number(el.value);
    } else v = el.value;
    if (el.type === "password" && !v) delete changed[p]; else changed[p] = v;
    mark();
  });
  const save = async restart => {
    const changes = Object.entries(changed).map(([path, value]) => ({path, value}));
    if (!changes.length) { toast("没有改动"); return; }
    const r = await api("/api/config", {changes});
    if (r.bad && r.bad.length) toast("这些没存上：" + r.bad.join("、"), true);
    if (r.done && r.done.length) { toast(`存好了 ${r.done.length} 项`); Object.keys(changed).forEach(k => delete changed[k]); mark(); }
    if (restart) { const x = await api("/api/bot", {action: "restart"}); toast(x.msg || x.error, !x.ok); }
  };
  $("#save").onclick = () => save(false); $("#saverestart").onclick = () => save(true);
};

      <div class="row" style="margin-bottom:8px"><input type="datetime-local" id="ats" value="${toLocal(Date.now() / 1000 + 600)}"><select id="arep">${REP.map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select>
        <select id="avia"><option value="at">群里 @ 他</option><option value="private">私聊发</option></select></div>
      <input type="text" id="awhat" placeholder="到点做什么（叫他起床 / 提醒他交作业 / 唱《雨爱》给他听）" style="width:100%">

  };
  await load();
  every(15000, load);
};

        ${(d.suggest || []).map(x => `<div class="row small" style="margin:8px 0 0 94px"><span class="badge acc">推荐</span><b>${esc(x.name)}</b><span class="muted">${esc(x.note || "")}</span>
          <a href="${esc(x.link)}" target="_blank" rel="noopener">先去 B站 听听</a><button class="btn small" data-sg="import" data-link="${esc(x.link)}">导入这首</button></div>`).join("")}

      </div>
      <div class="card"><h2>她会唱的歌（${d.songs.filter(x => x.exists && x.enabled !== false).length}）</h2>
        ${d.songs.length ? d.songs.map(x => `<div class="sgitem" data-id="${esc(x.id)}" style="border-top:1px solid var(--line);padding:12px 0">

      return;
    }
    let body = vals(it);
    if (a === "default") body = {id: it.dataset.id, default: true};
    if (a === "toggle") body = {id: it.dataset.id, enabled: b.textContent.trim() === "启用"};
    if (a === "delete") {

};

    bars($("#c1"), lab, [{name: "收到", color: "var(--c1)", values: s.days.map(d => (d.recv_private || 0) + (d.recv_group || 0))}, {name: "回复", color: "var(--c2)", values: s.days.map(d => (d.replies_private || 0) + (d.replies_group || 0))}]);
    bars($("#c2"), lab, [{name: "DeepSeek", color: "var(--c1)", values: s.days.map(d => d.cost.deepseek)}, {name: "语音", color: "var(--c2)", values: s.days.map(d => d.cost.voice)}, {name: "搜索", color: "var(--c3)", values: s.days.map(d => d.cost.search)}], {stacked: true, money: true});
    curvechart($("#c4"), s.budget);
    const pts = (s.mood || []).map(([k, v]) => [new Date(k.replace(" ", "T") + ":00:00").getTime() / 1000, v]);

  };

/* ───────── 用量和余额 ───────── */
const CUR = {CNY: "¥", USD: "$"};
function balText(b) {
  if (!b) return "查询中…";
  if (!b.ok) return esc(b.error || "查不到");
  return (b.infos || []).map(x => `${CUR[x.currency] || x.currency + " "}${esc(x.total_balance)}`).join(" / ") || "—";
}
function balStat(b) {
  const sub = b && b.ok ? (b.available ? "官方余额接口 5 分钟查一次" : '<span style="color:var(--bad)">不够用了</span>') : b ? esc(b.error || "查不到") : "查询中…";
  return kpi("wallet", "DeepSeek 余额", b && b.ok ? balText(b) : "—", sub, null, "", ' title="DeepSeek 官方余额接口 5 分钟查一次"');
}
const kt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : num(n);
function peakLine(pk) {
  if (!pk || !pk.enabled) return "";
  const hrs = (pk.hours || []).map(([a, b]) => `${a}-${b}`).join("、");
  return `<div class="small" style="margin:-2px 0 8px"><span class="badge ${pk.now ? "warn" : "good"}">DeepSeek 现在${esc(pk.text || "")}</span> <span class="muted">高峰 = 北京时间 周一到周五 ${esc(hrs)} 点（价格翻倍）${pk.defer ? " · 高峰时群里的记忆提炼、前情提要、学梗先攒着 过了再做" : ""}</span></div>`;
}
const cny = (v, p) => "¥" + ((v || 0) * (p.usd_cny || 7.1)).toFixed(2);
function animCard(a) {
  const st = a.status || {}, td = a.today || {}, left = Math.max(0, (a.budget || 0) - (a.spent || 0));
  const head = `<div class="row"><h2 style="margin:0">动画</h2><span class="badge">火山方舟 ${esc(a.model || "")} · ${esc(a.resolution || "")} · ${esc(a.duration || 5)} 秒</span><span class="spacer"></span><a class="small" href="${esc(a.console || "#")}" target="_blank" rel="noopener">去火山控制台看余额</a></div>`;
  if (!a.has_key) return `<div class="card">${head}<div class="empty">还没填火山方舟的 key（功能开关 → 密钥）</div></div>`;
  const badge = a.enabled === false ? '<span class="badge">关着</span>' : st.ready === false ? `<span class="badge bad">${esc(st.why || "暂停中")}</span>` : '<span class="badge good">能做</span>';
  return `<div class="card">${head}
    <div class="row" style="margin:10px 0 6px"><b style="font-size:24px">¥${(a.spent || 0).toFixed(2)}</b><span class="muted">/ 预算 ¥${esc(a.budget)}（还能花 ¥${left.toFixed(2)}）</span>${badge}</div>
    <div class="small muted">一共做了 ${num(a.count)} 条 · 今天做好 ${num(td.made)} 条（你 ${num(td.owner)} / 别人 ${num(td.others)} / 她自己 ${num(td.proactive)}）${td.failed ? " · 没做出来 " + num(td.failed) + " 条" : ""}${a.running ? " · 正在做 " + num(a.running) + " 条" : ""}</div>
    ${a.last_error ? `<div class="small" style="color:var(--bad);margin-top:6px">最近一次失败：${esc(a.last_error)}</div>` : ""}
    ${(a.history || []).length ? `<table style="margin-top:10px"><tr><th>时间</th><th>画面</th><th>花费</th></tr>${a.history.map(x => `<tr><td style="white-space:nowrap">${hm(x.t)}</td><td>${esc(x.prompt || "")}${x.ok ? "" : ` <span class="muted">（没做出来：${esc(x.why || "")}）</span>`}</td><td>${x.ok ? "¥" + (x.cny || 0).toFixed(2) : "—"}</td></tr>`).join("")}</table>` : '<div class="empty">还没做过动画</div>'}
    <div class="small muted" style="margin-top:6px">花费 = 火山返回的 token 数 × 每百万 token ¥${esc(a.price)}，真实余额以火山控制台为准</div></div>`;
}

/* ───────── 日志 ───────── */
const TAGS = ["接话", "说到做到", "表情包", "语音", "唱歌", "动画", "补回", "节奏", "冒泡", "搜索", "学梗", "梗百科", "认AI", "记忆", "心情", "控制台", "QQ", "启动", "B站", "错误"];
function fmtLog(line) {
  let s = esc(line);
  s = s.replace(/^\[(\d\d:\d\d:\d\d)\]/, '<span class="t">[$1]</span>');
  s = s.replace(/\[([^\]\s]{1,8})\]/g, (m, t) => TAGS.some(x => t.startsWith(x)) || t.startsWith("模型") ? `<span class="tag">[${t}]</span>` : m);
  if (/出错|失败|Traceback|Error|异常|超时/.test(line)) s = `<span class="err">${s}</span>`;
  return s;
}
VIEWS.logs = async main => {
  const on = new Set();
  main.innerHTML = `<h1>日志</h1><p class="sub">她在干什么、为什么回/不回，都写在这里</p>
    <div class="row" style="margin-bottom:10px">${TAGS.map(t => `<button class="chip" data-t="${t}">${t}</button>`).join("")}</div>
    <div class="row" style="margin-bottom:10px"><input type="text" id="lq" placeholder="搜（比如群号、人名）" style="width:220px"><select id="ln"><option>200</option><option selected>500</option><option>1500</option></select>
      <label class="row small"><span class="sw"><input type="checkbox" id="auto" checked><span></span></span>自动刷新</label><span class="spacer"></span><button class="btn small" id="lr">刷新</button></div>
    <div class="logbox" id="lb">读取中…</div>`;
  const load = async () => {
    const r = await api(`/api/logs?n=${$("#ln").value}&tags=${encodeURIComponent([...on].join(","))}&q=${encodeURIComponent($("#lq").value.trim())}`);
    const box = $("#lb"), stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = (r.lines || []).map(fmtLog).join("\n") || "（没有符合的）";
    if (stick) box.scrollTop = box.scrollHeight;
  };
  main.querySelector(".row").onclick = e => { const t = e.target.dataset.t; if (!t) return; on.has(t) ? on.delete(t) : on.add(t); e.target.classList.toggle("on"); load(); };
  $("#lq").onchange = load; $("#ln").onchange = load; $("#lr").onclick = load;
  await load(); $("#lb").scrollTop = 1e7;
  every(3000, () => { if ($("#auto") && $("#auto").checked) load(); });
};
